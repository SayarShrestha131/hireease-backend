<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Vehicle Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <!-- Login Screen -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center px-4">
        <div class="max-w-md w-full bg-white rounded-lg shadow-lg p-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Admin Panel</h1>
            <p class="text-gray-600 mb-6">Vehicle Management System</p>
            
            <div id="loginError" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded mb-4"></div>
            
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                    <input type="email" id="loginEmail" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                    <input type="password" id="loginPassword" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <button type="submit" 
                    class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
                    Login
                </button>
            </form>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminDashboard" class="hidden min-h-screen">
        <!-- Header -->
        <header class="bg-white shadow">
            <div class="max-w-7xl mx-auto px-4 py-4">
                <div class="flex justify-between items-center mb-4">
                    <h1 class="text-2xl font-bold text-gray-800">Admin Panel</h1>
                    <div class="flex items-center space-x-4">
                        <span id="adminEmail" class="text-gray-600"></span>
                        <button onclick="logout()" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700">
                            Logout
                        </button>
                    </div>
                </div>
                <!-- Navigation Tabs -->
                <div class="flex space-x-4 border-b">
                    <button onclick="showTab('vehicles')" id="vehiclesTab" class="px-4 py-2 font-semibold border-b-2 border-blue-600 text-blue-600">
                        Vehicles
                    </button>
                    <button onclick="showTab('kyc')" id="kycTab" class="px-4 py-2 font-semibold text-gray-600 hover:text-blue-600">
                        KYC Verification
                        <span id="pendingBadge" class="ml-2 bg-yellow-500 text-white text-xs px-2 py-1 rounded-full hidden">0</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto px-4 py-8">
            <!-- Vehicles Tab -->
            <div id="vehiclesContent">
            <!-- Add Vehicle Form -->
            <div class="bg-white rounded-lg shadow-lg p-6 mb-8">
                <h2 class="text-xl font-bold text-gray-800 mb-6">Add New Vehicle</h2>
                
                <div id="vehicleError" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded mb-4"></div>
                <div id="vehicleSuccess" class="hidden bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded mb-4"></div>
                
                <form id="vehicleForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Vehicle Name *</label>
                        <input type="text" name="name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Brand *</label>
                        <input type="text" name="brand" required class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Model *</label>
                        <input type="text" name="vehicleModel" required class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Year *</label>
                        <input type="number" name="year" required min="2000" max="2025" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Type *</label>
                        <select name="type" required class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                            <option value="">Select Type</option>
                            <option value="sedan">Sedan</option>
                            <option value="suv">SUV</option>
                            <option value="hatchback">Hatchback</option>
                            <option value="truck">Truck</option>
                            <option value="van">Van</option>
                            <option value="sports">Sports</option>
                            <option value="electric">Electric</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Fuel Type *</label>
                        <select name="fuelType" required class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                            <option value="">Select Fuel Type</option>
                            <option value="petrol">Petrol</option>
                            <option value="diesel">Diesel</option>
                            <option value="electric">Electric</option>
                            <option value="hybrid">Hybrid</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Transmission *</label>
                        <select name="transmission" required class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                            <option value="">Select Transmission</option>
                            <option value="manual">Manual</option>
                            <option value="automatic">Automatic</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Seats *</label>
                        <input type="number" name="seats" required min="2" max="12" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Price Per Day (Rs.) *</label>
                        <input type="number" name="pricePerDay" required min="0" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Location *</label>
                        <input type="text" name="location" required class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Color</label>
                        <input type="text" name="color" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Engine</label>
                        <input type="text" name="engine" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Power</label>
                        <input type="text" name="power" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Mileage</label>
                        <input type="text" name="mileage" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                    </div>
                    
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Description *</label>
                        <textarea name="description" required rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg"></textarea>
                    </div>
                    
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Features (comma separated)</label>
                        <input type="text" name="features" placeholder="AC, GPS, Bluetooth, etc." class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                    </div>
                    
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Image URLs (comma separated)</label>
                        <input type="text" name="images" placeholder="https://example.com/image1.jpg, https://example.com/image2.jpg" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                        <p class="text-xs text-gray-500 mt-1">Enter image URLs separated by commas. You can use Unsplash or other image hosting services.</p>
                    </div>
                    
                    <div class="md:col-span-2">
                        <label class="flex items-center">
                            <input type="checkbox" name="isAvailable" checked class="mr-2">
                            <span class="text-sm font-medium text-gray-700">Available for Rent</span>
                        </label>
                    </div>
                    
                    <div class="md:col-span-2">
                        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition font-semibold">
                            Add Vehicle
                        </button>
                    </div>
                </form>
            </div>

            <!-- Vehicle List -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-xl font-bold text-gray-800 mb-6">All Vehicles</h2>
                <div id="vehicleList" class="space-y-4">
                    <p class="text-gray-500 text-center py-8">Loading vehicles...</p>
                </div>
            </div>
            </div>

            <!-- KYC Tab -->
            <div id="kycContent" class="hidden">
                <!-- Enhanced Filter Section -->
                <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                    <h3 class="text-lg font-semibold text-gray-800 mb-4">Filters & Search</h3>
                    
                    <!-- Status Filter Tabs -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Status</label>
                        <div class="flex space-x-2">
                            <button onclick="filterKYC('all')" id="filterAll" class="px-4 py-2 rounded-lg bg-blue-600 text-white font-semibold">
                                All
                            </button>
                            <button onclick="filterKYC('pending')" id="filterPending" class="px-4 py-2 rounded-lg bg-gray-200 text-gray-700 font-semibold hover:bg-gray-300">
                                Pending
                            </button>
                            <button onclick="filterKYC('approved')" id="filterApproved" class="px-4 py-2 rounded-lg bg-gray-200 text-gray-700 font-semibold hover:bg-gray-300">
                                Approved
                            </button>
                            <button onclick="filterKYC('rejected')" id="filterRejected" class="px-4 py-2 rounded-lg bg-gray-200 text-gray-700 font-semibold hover:bg-gray-300">
                                Rejected
                            </button>
                        </div>
                    </div>

                    <!-- Advanced Filters Row -->
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                        <!-- Face Confidence Filter -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Face Confidence</label>
                            <select id="faceConfidenceFilter" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <option value="all">All Levels</option>
                                <option value="low">Low (&lt; 60%)</option>
                                <option value="medium">Medium (60-85%)</option>
                                <option value="high">High (&gt; 85%)</option>
                            </select>
                        </div>

                        <!-- OCR Confidence Filter -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">OCR Confidence</label>
                            <select id="ocrConfidenceFilter" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <option value="all">All Levels</option>
                                <option value="low">Low (&lt; 60%)</option>
                                <option value="medium">Medium (60-85%)</option>
                                <option value="high">High (&gt; 85%)</option>
                            </select>
                        </div>

                        <!-- Auto-Approval Filter -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Approval Type</label>
                            <select id="autoApprovalFilter" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <option value="all">All Types</option>
                                <option value="auto">Auto-Approved</option>
                                <option value="manual">Manual Review</option>
                            </select>
                        </div>

                        <!-- Sort Options -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Sort By</label>
                            <select id="sortByFilter" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <option value="submittedAt">Submission Date</option>
                                <option value="faceConfidence">Face Confidence</option>
                                <option value="ocrConfidence">OCR Confidence</option>
                            </select>
                        </div>
                    </div>

                    <!-- Search and Sort Order Row -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <!-- Enhanced Search -->
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Search</label>
                            <div class="relative">
                                <input 
                                    type="text" 
                                    id="searchInput" 
                                    placeholder="Search by name, license number, or citizenship number..." 
                                    class="w-full px-4 py-2 pl-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                >
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                                    </svg>
                                </div>
                            </div>
                        </div>

                        <!-- Sort Order -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Sort Order</label>
                            <select id="sortOrderFilter" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <option value="desc">Descending</option>
                                <option value="asc">Ascending</option>
                            </select>
                        </div>
                    </div>

                    <!-- Apply Filters Button -->
                    <div class="mt-4 flex justify-between items-center">
                        <div class="flex space-x-2">
                            <button onclick="applyFilters()" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 font-semibold">
                                Apply Filters
                            </button>
                            <button onclick="clearFilters()" class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600 font-semibold">
                                Clear All
                            </button>
                        </div>
                        
                        <!-- Quick Filter Presets -->
                        <div class="flex space-x-2">
                            <button onclick="applyQuickFilter('highConfidence')" class="bg-green-100 text-green-700 px-3 py-1 rounded text-sm hover:bg-green-200">
                                High Confidence
                            </button>
                            <button onclick="applyQuickFilter('lowConfidence')" class="bg-red-100 text-red-700 px-3 py-1 rounded text-sm hover:bg-red-200">
                                Needs Review
                            </button>
                            <button onclick="applyQuickFilter('autoApproved')" class="bg-blue-100 text-blue-700 px-3 py-1 rounded text-sm hover:bg-blue-200">
                                Auto-Approved
                            </button>
                        </div>
                    </div>
                </div>

                <!-- KYC Submissions List -->
                <div class="bg-white rounded-lg shadow-lg p-6">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-bold text-gray-800">KYC Submissions</h2>
                        <div id="resultsInfo" class="text-sm text-gray-600">
                            <!-- Results count will be displayed here -->
                        </div>
                    </div>
                    <div id="kycList" class="space-y-4">
                        <p class="text-gray-500 text-center py-8">Loading KYC submissions...</p>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- KYC Detail Modal -->
    <div id="kycModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg max-w-4xl w-full max-h-[90vh] overflow-y-auto">
            <div class="p-6">
                <div class="flex justify-between items-start mb-6">
                    <h2 class="text-2xl font-bold text-gray-800">KYC Submission Details</h2>
                    <button onclick="closeKYCModal()" class="text-gray-500 hover:text-gray-700">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>

                <div id="kycModalContent">
                    <!-- Content will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Admin Action Modal (Approve/Reject/Revoke) -->
    <div id="actionModal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg max-w-lg w-full overflow-hidden shadow-xl">
            <div class="px-6 py-4 border-b border-gray-200 flex items-start justify-between">
                <div>
                    <h3 id="actionModalTitle" class="text-xl font-bold text-gray-800">Action</h3>
                    <p id="actionModalSubtitle" class="text-sm text-gray-600 mt-1"></p>
                </div>
                <button onclick="closeActionModal()" class="text-gray-500 hover:text-gray-700">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <div class="px-6 py-5">
                <div id="actionModalError" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded mb-4"></div>

                <label id="actionModalLabel" class="block text-sm font-medium text-gray-700 mb-2"></label>
                <textarea
                    id="actionModalText"
                    rows="4"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    placeholder=""
                ></textarea>

                <div class="mt-2 flex items-center justify-between">
                    <p id="actionModalHint" class="text-xs text-gray-500"></p>
                    <span id="actionModalCounter" class="text-xs text-gray-500"></span>
                </div>
            </div>

            <div class="px-6 py-4 bg-gray-50 border-t border-gray-200 flex gap-3 justify-end">
                <button
                    id="actionModalCancel"
                    onclick="closeActionModal()"
                    class="px-4 py-2 rounded-lg bg-white border border-gray-300 text-gray-700 font-semibold hover:bg-gray-100"
                >
                    Cancel
                </button>
                <button
                    id="actionModalConfirm"
                    onclick="submitActionModal()"
                    class="px-4 py-2 rounded-lg bg-blue-600 text-white font-semibold hover:bg-blue-700"
                >
                    Confirm
                </button>
            </div>
        </div>
    </div>

    <script>
        // Use current host for API URL (works for both localhost and network IP)
        const API_URL = `${window.location.protocol}//${window.location.hostname}:${window.location.port}/api`;
        let authToken = localStorage.getItem('adminToken');
        
        console.log('API URL:', API_URL);

        // Check if already logged in
        if (authToken) {
            checkAuth();
        }

        // Login Form
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    // Check if user is admin
                    if (data.data.user.role !== 'admin') {
                        showError('loginError', 'Access denied. Admin privileges required.');
                        return;
                    }

                    authToken = data.data.token;
                    localStorage.setItem('adminToken', authToken);
                    localStorage.setItem('adminEmail', data.data.user.email);
                    showDashboard();
                } else {
                    // Handle error message properly
                    let errorMessage = 'Login failed';
                    if (typeof data.error === 'string') {
                        errorMessage = data.error;
                    } else if (data.error && data.error.message) {
                        errorMessage = data.error.message;
                    }
                    showError('loginError', errorMessage);
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('loginError', 'Network error. Please check if the backend server is running.');
            }
        });

        // Vehicle Form
        document.getElementById('vehicleForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            const vehicleData = {
                name: formData.get('name'),
                brand: formData.get('brand'),
                vehicleModel: formData.get('vehicleModel'),
                year: parseInt(formData.get('year')),
                type: formData.get('type'),
                fuelType: formData.get('fuelType'),
                transmission: formData.get('transmission'),
                seats: parseInt(formData.get('seats')),
                pricePerDay: parseFloat(formData.get('pricePerDay')),
                description: formData.get('description'),
                features: formData.get('features') ? formData.get('features').split(',').map(f => f.trim()) : [],
                images: formData.get('images') ? formData.get('images').split(',').map(img => img.trim()) : [],
                specifications: {
                    color: formData.get('color'),
                    engine: formData.get('engine'),
                    power: formData.get('power'),
                    mileage: formData.get('mileage')
                },
                availability: {
                    isAvailable: formData.get('isAvailable') === 'on',
                    location: formData.get('location')
                }
            };

            try {
                const response = await fetch(`${API_URL}/vehicles`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify(vehicleData)
                });

                const data = await response.json();

                if (data.success) {
                    showSuccess('vehicleSuccess', 'Vehicle added successfully!');
                    e.target.reset();
                    loadVehicles();
                    setTimeout(() => hideMessage('vehicleSuccess'), 3000);
                } else {
                    // Handle error message properly
                    let errorMessage = 'Failed to add vehicle';
                    if (typeof data.error === 'string') {
                        errorMessage = data.error;
                    } else if (data.error && data.error.message) {
                        errorMessage = data.error.message;
                    }
                    showError('vehicleError', errorMessage);
                }
            } catch (error) {
                console.error('Vehicle creation error:', error);
                showError('vehicleError', 'Network error. Please check if the backend server is running.');
            }
        });

        async function checkAuth() {
            try {
                const response = await fetch(`${API_URL}/profile`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.data.user.role === 'admin') {
                        showDashboard();
                        return;
                    }
                }
            } catch (error) {
                console.error('Auth check failed:', error);
            }
            
            logout();
        }

        function showDashboard() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('adminDashboard').classList.remove('hidden');
            document.getElementById('adminEmail').textContent = localStorage.getItem('adminEmail');
            loadVehicles();
        }

        async function loadVehicles() {
            try {
                const response = await fetch(`${API_URL}/vehicles`);
                const data = await response.json();

                if (data.success) {
                    const vehicleList = document.getElementById('vehicleList');
                    if (data.data.vehicles.length === 0) {
                        vehicleList.innerHTML = '<p class="text-gray-500 text-center py-8">No vehicles added yet</p>';
                        return;
                    }

                    vehicleList.innerHTML = data.data.vehicles.map(vehicle => `
                        <div class="border border-gray-200 rounded-lg p-4">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="text-lg font-bold text-gray-800">${vehicle.name}</h3>

            element.textContent = message;
            element.classList.remove('hidden');

        function showSuccess(elementId, message) {

        // KYC Management Functions

        function showTab(tab) {
            // Update tab buttons
            document.getElementById('vehiclesTab').classList.remove('border-blue-600', 'text-blue-600');
            document.getElementById('vehiclesTab').classList.add('text-gray-600');
            document.getElementById('kycTab').classList.remove('border-blue-600', 'text-blue-600');
            document.getElementById('kycTab').classList.add('text-gray-600');

            // Show/hide content
            if (tab === 'vehicles') {
                document.getElementById('vehiclesTab').classList.add('border-blue-600', 'text-blue-600');
                document.getElementById('vehiclesTab').classList.remove('text-gray-600');
                document.getElementById('vehiclesContent').classList.remove('hidden');
                document.getElementById('kycContent').classList.add('hidden');
            } else if (tab === 'kyc') {
                document.getElementById('kycTab').classList.add('border-blue-600', 'text-blue-600');
                document.getElementById('kycTab').classList.remove('text-gray-600');
                document.getElementById('vehiclesContent').classList.add('hidden');
                document.getElementById('kycContent').classList.remove('hidden');
                loadKYCSubmissions();
            }

        // Enhanced filtering state
        let currentFilters = {
            status: 'all',
            faceConfidence: 'all',
            ocrConfidence: 'all',
            autoApproval: 'all',
            search: '',
            sortBy: 'submittedAt',
            sortOrder: 'desc'
        };

        function filterKYC(status) {
            currentFilters.status = status;
            
            // Update filter buttons
            ['filterAll', 'filterPending', 'filterApproved', 'filterRejected'].forEach(id => {
                const btn = document.getElementById(id);
                btn.classList.remove('bg-blue-600', 'text-white');
                btn.classList.add('bg-gray-200', 'text-gray-700');
            });
            
            document.getElementById(`filter${status.charAt(0).toUpperCase() + status.slice(1)}`).classList.remove('bg-gray-200', 'text-gray-700');
            document.getElementById(`filter${status.charAt(0).toUpperCase() + status.slice(1)}`).classList.add('bg-blue-600', 'text-white');
            
            loadKYCSubmissions();
        }

        function applyFilters() {
            // Get all filter values
            currentFilters.faceConfidence = document.getElementById('faceConfidenceFilter').value;
            currentFilters.ocrConfidence = document.getElementById('ocrConfidenceFilter').value;
            currentFilters.autoApproval = document.getElementById('autoApprovalFilter').value;
            currentFilters.search = document.getElementById('searchInput').value;
            currentFilters.sortBy = document.getElementById('sortByFilter').value;
            currentFilters.sortOrder = document.getElementById('sortOrderFilter').value;
            
            loadKYCSubmissions();
        }

        function applyQuickFilter(preset) {
            clearFilters();
            
            switch(preset) {
                case 'highConfidence':
                    document.getElementById('faceConfidenceFilter').value = 'high';
                    document.getElementById('ocrConfidenceFilter').value = 'high';
                    currentFilters.faceConfidence = 'high';
                    currentFilters.ocrConfidence = 'high';
                    break;
                    
                case 'lowConfidence':
                    document.getElementById('faceConfidenceFilter').value = 'low';
                    document.getElementById('ocrConfidenceFilter').value = 'low';
                    currentFilters.faceConfidence = 'low';
                    currentFilters.ocrConfidence = 'low';
                    break;
                    
                case 'autoApproved':
                    document.getElementById('autoApprovalFilter').value = 'auto';
                    currentFilters.autoApproval = 'auto';
                    break;
            }
            
            loadKYCSubmissions();
        }

        function clearFilters() {
            // Reset all filters to default
            currentFilters = {
                status: 'all',
                faceConfidence: 'all',
                ocrConfidence: 'all',
                autoApproval: 'all',
                search: '',
                sortBy: 'submittedAt',
                sortOrder: 'desc'
            };
            
            // Reset UI elements
            document.getElementById('faceConfidenceFilter').value = 'all';
            document.getElementById('ocrConfidenceFilter').value = 'all';
            document.getElementById('autoApprovalFilter').value = 'all';
            document.getElementById('searchInput').value = '';
            document.getElementById('sortByFilter').value = 'submittedAt';
            document.getElementById('sortOrderFilter').value = 'desc';
            
            // Reset status filter buttons
            filterKYC('all');
        }

        // Add event listeners for real-time search
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                let searchTimeout;
                searchInput.addEventListener('input', function() {
                    clearTimeout(searchTimeout);
                    searchTimeout = setTimeout(() => {
                        applyFilters();
                    }, 500); // Debounce search by 500ms
                });
            }
        });

        async function loadKYCSubmissions() {
            try {
                // Build query parameters
                const params = new URLSearchParams();
                
                if (currentFilters.status !== 'all') {
                    params.append('status', currentFilters.status);
                }
                if (currentFilters.faceConfidence !== 'all') {
                    params.append('faceConfidence', currentFilters.faceConfidence);
                }
                if (currentFilters.ocrConfidence !== 'all') {
                    params.append('ocrConfidence', currentFilters.ocrConfidence);
                }
                if (currentFilters.autoApproval !== 'all') {
                    params.append('autoApproval', currentFilters.autoApproval);
                }
                if (currentFilters.search.trim()) {
                    params.append('search', currentFilters.search.trim());
                }
                params.append('sortBy', currentFilters.sortBy);
                params.append('sortOrder', currentFilters.sortOrder);
                
                const url = `${API_URL}/kyc/admin/submissions?${params.toString()}`;
                    
                const response = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                const data = await response.json();

                if (data.success) {
                    const kycList = document.getElementById('kycList');
                    const resultsInfo = document.getElementById('resultsInfo');
                    
                    // Update results info
                    const totalResults = data.data.total || 0;
                    const currentPage = data.data.page || 1;
                    const totalPages = data.data.totalPages || 1;
                    const showing = data.data.submissions.length;
                    
                    resultsInfo.innerHTML = `
                        Showing ${showing} of ${totalResults} submissions
                        ${totalPages > 1 ? `(Page ${currentPage} of ${totalPages})` : ''}
                    `;
                    
                    // Update pending badge
                    const pendingBadge = document.getElementById('pendingBadge');
                    if (data.data.pendingCount > 0) {
                        pendingBadge.textContent = data.data.pendingCount;
                        pendingBadge.classList.remove('hidden');
                    } else {
                        pendingBadge.classList.add('hidden');
                    }
                    
                    if (data.data.submissions.length === 0) {
                        kycList.innerHTML = '<p class="text-gray-500 text-center py-8">No KYC submissions found matching the current filters</p>';
                        return;
                    }

                    kycList.innerHTML = data.data.submissions.map(submission => {
                        const statusColors = {
                            pending: 'bg-yellow-100 text-yellow-800',
                            approved: 'bg-green-100 text-green-800',
                            rejected: 'bg-red-100 text-red-800'
                        };
                        
                        const userName = submission.user ? 
                            `${submission.user.firstName || ''} ${submission.user.lastName || ''}`.trim() || submission.fullName 
                            : submission.fullName;
                        const userEmail = submission.user?.email || 'N/A';
                        
                        // Get confidence scores for display
                        const faceConfidence = submission.faceDetection?.confidence || 0;
                        const ocrConfidence = submission.ocrData?.overallConfidence || 0;
                        const isAutoApproved = submission.isAutoApproved || false;
                        
                        // Confidence color coding
                        const getFaceConfidenceColor = (conf) => {
                            if (conf >= 85) return 'text-green-600';
                            if (conf >= 60) return 'text-yellow-600';
                            return 'text-red-600';
                        };
                        
                        const getOcrConfidenceColor = (conf) => {
                            if (conf >= 85) return 'text-green-600';
                            if (conf >= 60) return 'text-yellow-600';
                            return 'text-red-600';
                        };
                        
                        return `
                            <div class="border border-gray-200 rounded-lg p-4 hover:shadow-md transition cursor-pointer" onclick="viewKYCDetails('${submission._id}')">
                                <div class="flex justify-between items-start">
                                    <div class="flex-1">
                                        <div class="flex items-center space-x-2 mb-1">
                                            <h3 class="text-lg font-bold text-gray-800">${userName}</h3>
                                            ${isAutoApproved ? '<span class="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded-full font-semibold">AUTO</span>' : ''}
                                        </div>
                                        <p class="text-sm text-gray-600">${userEmail}</p>
                                        <p class="text-sm text-gray-600 mt-2">License: ${submission.licenseNumber}</p>
                                        ${submission.citizenshipNumber ? `<p class="text-sm text-gray-600">Citizenship: ${submission.citizenshipNumber}</p>` : ''}
                                        <p class="text-sm text-gray-600">Submitted: ${new Date(submission.submittedAt).toLocaleDateString()}</p>
                                        
                                        <!-- Confidence Scores -->
                                        <div class="flex space-x-4 mt-2">
                                            <div class="text-xs">
                                                <span class="text-gray-500">Face:</span>
                                                <span class="font-semibold ${getFaceConfidenceColor(faceConfidence)}">${faceConfidence.toFixed(1)}%</span>
                                                <div class="w-16 h-1 bg-gray-200 rounded-full mt-1">
                                                    <div class="h-1 rounded-full ${faceConfidence >= 85 ? 'bg-green-500' : faceConfidence >= 60 ? 'bg-yellow-500' : 'bg-red-500'}" style="width: ${faceConfidence}%"></div>
                                                </div>
                                            </div>
                                            <div class="text-xs">
                                                <span class="text-gray-500">OCR:</span>
                                                <span class="font-semibold ${getOcrConfidenceColor(ocrConfidence)}">${ocrConfidence.toFixed(1)}%</span>
                                                <div class="w-16 h-1 bg-gray-200 rounded-full mt-1">
                                                    <div class="h-1 rounded-full ${ocrConfidence >= 85 ? 'bg-green-500' : ocrConfidence >= 60 ? 'bg-yellow-500' : 'bg-red-500'}" style="width: ${ocrConfidence}%"></div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <span class="px-3 py-1 rounded-full text-xs font-semibold ${statusColors[submission.status]}">
                                        ${submission.status.toUpperCase()}
                                    </span>
                                </div>
                            </div>
                        `;
                    }).join('');
                }
            } catch (error) {
                console.error('Failed to load KYC submissions:', error);
                document.getElementById('kycList').innerHTML = '<p class="text-red-500 text-center py-8">Failed to load submissions</p>';
            }
        }

                                        <div class="text-sm">
                                            ${ocr.backImage.address ? `
                                                <div class="mb-2">
                                                    <p class="text-gray-600">Address</p>
                                                    <p class="font-semibold">${ocr.backImage.address}</p>
                                                </div>
                                            ` : ''}
                                        </div>
                                        <details class="mt-3">
                                            <summary class="cursor-pointer text-sm text-blue-600 hover:text-blue-700">View Raw Text</summary>
                                            <pre class="mt-2 p-2 bg-gray-50 rounded text-xs overflow-auto max-h-32">${ocr.backImage.rawText}</pre>
                                        </details>
                                    </div>
                                ` : ''}
                                
                                <p class="text-xs text-gray-500 mt-2">Extracted: ${new Date(ocr.extractedAt).toLocaleString()}</p>
                                
                                <!-- Overall Confidence Score -->
                                ${ocr.overallConfidence ? `
                                    <div class="mt-4 p-3 bg-white rounded border">
                                        <h4 class="font-semibold text-gray-700 mb-2">Overall Confidence Score</h4>
                                        <div class="flex items-center">
                                            <div class="flex-1">
                                                <div class="w-full bg-gray-200 rounded-full h-4">
                                                    <div class="h-4 rounded-full ${ocr.overallConfidence >= 90 ? 'bg-green-500' : ocr.overallConfidence >= 70 ? 'bg-yellow-500' : 'bg-red-500'}" 
                                                         style="width: ${ocr.overallConfidence}%"></div>
                                                </div>
                                            </div>
                                            <span class="ml-3 font-bold text-lg ${ocr.overallConfidence >= 90 ? 'text-green-600' : ocr.overallConfidence >= 70 ? 'text-yellow-600' : 'text-red-600'}">
                                                ${ocr.overallConfidence.toFixed(1)}%
                                            </span>
                                        </div>
                                        <p class="text-xs text-gray-500 mt-2">
                                            ${ocr.overallConfidence >= 90 ? '✅ Excellent - Auto-approval eligible' : 
                                              ocr.overallConfidence >= 70 ? '⚠️ Good - Manual review recommended' : 
                                              '❌ Poor - Manual review required'}
                                        </p>
                                    </div>
                                ` : ''}
                            </div>
                        `;
                    }
                    
                    // Show Data Verification Comparison
                    if (submission.dataVerification) {
                        const dv = submission.dataVerification;
                        content += `
                            <div class="bg-blue-50 rounded-lg p-4 border-2 border-blue-200">
                                <h3 class="font-bold text-blue-900 mb-3">🔍 Data Verification Analysis</h3>
                                <p class="text-sm text-blue-700 mb-4">Comparison between user-entered data and registered user database</p>
                                
                                <div class="space-y-3">
                                    <!-- License Number Match -->
                                    <div class="bg-white rounded p-3 border ${dv.licenseNumberMatch ? 'border-green-300' : 'border-red-300'}">
                                        <div class="flex items-center justify-between">
                                            <div class="flex items-center">
                                                <span class="text-2xl mr-2">${dv.licenseNumberMatch ? '✅' : '❌'}</span>
                                                <div>
                                                    <p class="font-semibold text-gray-800">License Number</p>
                                                    <p class="text-xs text-gray-600">User: ${submission.licenseNumber}</p>
                                                    <p class="text-xs text-gray-600">Database: ${submission.matchedUser?.licenseNumber || 'Not available'}</p>
                                                </div>
                                            </div>
                                            ${dv.fieldMatchScores?.licenseNumber ? 
                                                `<span class="font-bold ${dv.fieldMatchScores.licenseNumber >= 80 ? 'text-green-600' : 'text-red-600'}">${dv.fieldMatchScores.licenseNumber}%</span>` : 
                                                ''}
                                        </div>
                                    </div>
                                    
                                    <!-- Name Match -->
                                    <div class="bg-white rounded p-3 border ${dv.nameMatch ? 'border-green-300' : 'border-red-300'}">
                                        <div class="flex items-center justify-between">
                                            <div class="flex items-center">
                                                <span class="text-2xl mr-2">${dv.nameMatch ? '✅' : '❌'}</span>
                                                <div>
                                                    <p class="font-semibold text-gray-800">Full Name</p>
                                                    <p class="text-xs text-gray-600">User: ${submission.fullName}</p>
                                                    <p class="text-xs text-gray-600">Database: ${submission.matchedUser?.fullName || 'Not available'}</p>
                                                </div>
                                            </div>
                                            ${dv.fieldMatchScores?.fullName ? 
                                                `<span class="font-bold ${dv.fieldMatchScores.fullName >= 70 ? 'text-green-600' : 'text-red-600'}">${dv.fieldMatchScores.fullName}%</span>` : 
                                                ''}
                                        </div>
                                    </div>
                                    
                                    <!-- Father Name Match -->
                                    <div class="bg-white rounded p-3 border ${dv.fatherNameMatch ? 'border-green-300' : 'border-red-300'}">
                                        <div class="flex items-center justify-between">
                                            <div class="flex items-center">
                                                <span class="text-2xl mr-2">${dv.fatherNameMatch ? '✅' : '❌'}</span>
                                                <div>
                                                    <p class="font-semibold text-gray-800">Father Name</p>
                                                    <p class="text-xs text-gray-600">User: ${submission.fatherName || 'Not provided'}</p>
                                                    <p class="text-xs text-gray-600">Database: ${submission.matchedUser?.fatherName || 'Not available'}</p>
                                                </div>
                                            </div>
                                            ${dv.fieldMatchScores?.fatherName ? 
                                                `<span class="font-bold ${dv.fieldMatchScores.fatherName >= 70 ? 'text-green-600' : 'text-red-600'}">${dv.fieldMatchScores.fatherName}%</span>` : 
                                                ''}
                                        </div>
                                    </div>
                                    
                                    <!-- Overall Match Score -->
                                    <div class="bg-white rounded p-4 border-2 ${dv.matchScore >= 75 ? 'border-green-400' : 'border-red-400'}">
                                        <div class="flex items-center justify-between mb-2">
                                            <h4 class="font-bold text-gray-800">Overall Match Score</h4>
                                            <span class="text-2xl font-bold ${dv.matchScore >= 75 ? 'text-green-600' : 'text-red-600'}">${dv.matchScore}%</span>
                                        </div>
                                        <div class="w-full bg-gray-200 rounded-full h-3">
                                            <div class="h-3 rounded-full ${dv.matchScore >= 75 ? 'bg-green-500' : 'bg-red-500'}" 
                                                 style="width: ${dv.matchScore}%"></div>
                                        </div>
                                        <p class="text-xs text-gray-600 mt-2">
                                            ${dv.matchScore >= 75 ? '✅ Data verification passed - High confidence match' : '❌ Data verification failed - Manual review required'}
                                        </p>
                                    </div>
                                </div>
                                
                                <p class="text-xs text-gray-500 mt-3">Checked: ${new Date(dv.checkedAt).toLocaleString()}</p>
                            </div>
                        `;
                    }
                    
                    // Show Auto-Approval Status
                    if (submission.isAutoApproved) {
                        content += `
                            <div class="bg-green-50 rounded-lg p-4 border-2 border-green-300">
                                <h3 class="font-bold text-green-900 mb-2">✅ Auto-Approved</h3>
                                <p class="text-sm text-green-700">This KYC was automatically approved based on high confidence scores:</p>
                                <ul class="text-sm text-green-700 mt-2 ml-4 list-disc">
                                    <li>OCR Confidence ≥ 80%</li>
                                    <li>Face Detection Confidence ≥ 70%</li>
                                    <li>Data Match Score ≥ 75%</li>
                                </ul>
                                <p class="text-xs text-green-600 mt-2">No admin intervention was required.</p>
                            </div>
                        `;
                    }
                    
                    // Show review note if exists
                    if (submission.reviewNote) {
                        content += `
                            <div class="bg-gray-50 rounded-lg p-4">
                                <h3 class="font-bold text-gray-800 mb-2">${submission.status === 'rejected' ? 'Rejection Reason' : 'Review Note'}</h3>
                                <p class="text-gray-700">${submission.reviewNote}</p>
                                ${submission.reviewedAt ? `<p class="text-sm text-gray-500 mt-2">Reviewed: ${new Date(submission.reviewedAt).toLocaleDateString()}</p>` : ''}
                            </div>
                        `;
                    }
                    
                    // Add comparison buttons for all submissions
                    content += `
                    `;
                    
                    // Show action buttons only for pending submissions
                    if (submission.status === 'pending') {
                        content += `
                            <div class="flex space-x-4">
                                <button onclick="rejectKYC('${submission._id}')" 
                                        class="flex-1 bg-red-600 text-white py-3 rounded-lg hover:bg-red-700 font-semibold">
                                    Reject
                                </button>
                                <button onclick="approveKYC('${submission._id}')" 
                                        class="flex-1 bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 font-semibold">
                                    Approve
                                </button>
                            </div>
                        `;
                    }
                    
                    // Show revoke button for approved submissions
                    if (submission.status === 'approved') {
                        content += `
                            <div class="pt-4 border-t">
                                <button onclick="revokeKYC('${submission._id}')" 
                                        class="w-full bg-red-600 text-white py-3 rounded-lg hover:bg-red-700 font-semibold">
                                    Revoke Approval
                                </button>
                                <p class="text-sm text-gray-600 text-center mt-2">
                                    Revoke this approved KYC and require user to resubmit
                                </p>
                            </div>
                        `;
                    }
                    
                    content += '</div>';
                    
                    document.getElementById('kycModalContent').innerHTML = content;
                    document.getElementById('kycModal').classList.remove('hidden');
                }
            } catch (error) {
                console.error('Failed to load KYC details:', error);
                alert('Failed to load KYC details');
            }
        }

        function closeKYCModal() {
            document.getElementById('kycModal').classList.add('hidden');
        }

        // Action modal state
        const actionState = {
            type: null, // 'approve' | 'reject' | 'revoke'
            submissionId: null,
        };

        function showInlineError(elementId, message) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.classList.remove('hidden');
        }

        function hideInlineError(elementId) {
            document.getElementById(elementId).classList.add('hidden');
        }

        function openActionModal(type, submissionId) {
            actionState.type = type;
            actionState.submissionId = submissionId;

            const title = document.getElementById('actionModalTitle');
            const subtitle = document.getElementById('actionModalSubtitle');
            const label = document.getElementById('actionModalLabel');
            const text = document.getElementById('actionModalText');
            const hint = document.getElementById('actionModalHint');
            const counter = document.getElementById('actionModalCounter');
            const confirmBtn = document.getElementById('actionModalConfirm');

            hideInlineError('actionModalError');
            text.value = '';

            const setCounter = () => {
                const len = (text.value || '').trim().length;
                counter.textContent = type === 'approve' ? `${len} chars` : `${len}/10 minimum`;
            };
            text.oninput = setCounter;
            setCounter();

            if (type === 'approve') {
                title.textContent = 'Approve KYC';
                subtitle.textContent = 'Confirm approval. You can add an optional note (shown to the user).';
                label.textContent = 'Approval note (optional)';
                text.placeholder = 'Optional note...';
                hint.textContent = 'Tip: mention what you verified.';
                confirmBtn.textContent = 'Approve';
                confirmBtn.className = 'px-4 py-2 rounded-lg bg-green-600 text-white font-semibold hover:bg-green-700';
            } else if (type === 'reject') {
                title.textContent = 'Reject KYC';
                subtitle.textContent = 'Reject this submission and provide a clear reason (shown to the user).';
                label.textContent = 'Rejection reason (required)';
                text.placeholder = 'Write at least 10 characters...';
                hint.textContent = 'Example: “Selfie face mismatch / unclear selfie / wrong person.”';
                confirmBtn.textContent = 'Reject';
                confirmBtn.className = 'px-4 py-2 rounded-lg bg-red-600 text-white font-semibold hover:bg-red-700';
            } else if (type === 'revoke') {
                title.textContent = 'Revoke Approved KYC';
                subtitle.textContent = 'This will change status to rejected and require resubmission.';
                label.textContent = 'Revocation reason (required)';
                text.placeholder = 'Write at least 10 characters...';
                hint.textContent = 'Example: “Fraud suspected after review.”';
                confirmBtn.textContent = 'Revoke';
                confirmBtn.className = 'px-4 py-2 rounded-lg bg-red-600 text-white font-semibold hover:bg-red-700';
            }

            document.getElementById('actionModal').classList.remove('hidden');
            setTimeout(() => text.focus(), 0);
        }

        function closeActionModal() {
            actionState.type = null;
            actionState.submissionId = null;
            document.getElementById('actionModal').classList.add('hidden');
        }

        async function submitActionModal() {
            const type = actionState.type;
            const submissionId = actionState.submissionId;
            const text = document.getElementById('actionModalText').value || '';
            const value = text.trim();

            hideInlineError('actionModalError');

            if (!type || !submissionId) {
                showInlineError('actionModalError', 'Invalid action state. Please close and retry.');
                return;
            }

            if (type !== 'approve' && value.length < 10) {
                showInlineError('actionModalError', 'Reason must be at least 10 characters.');
                return;
            }

            const url =
                type === 'approve'
                    ? `${API_URL}/kyc/admin/submissions/${submissionId}/approve`
                    : type === 'reject'
                        ? `${API_URL}/kyc/admin/submissions/${submissionId}/reject`
                        : `${API_URL}/kyc/admin/submissions/${submissionId}/revoke`;

            const body =
                type === 'approve'
                    ? { reviewNote: value || undefined }
                    : { reason: value };

            try {
                const response = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify(body)
                });

                const data = await response.json();

                if (data.success) {
                    closeActionModal();
                    closeKYCModal();
                    loadKYCSubmissions();
                } else {
                    const msg = typeof data.error === 'string' ? data.error : (data.error?.message || 'Request failed');
                    showInlineError('actionModalError', msg);
                }
            } catch (error) {
                console.error('Admin action failed:', error);
                showInlineError('actionModalError', 'Network error. Please check if the backend is running.');
            }
        }

        // Legacy API for buttons inside KYC modal
        function approveKYC(submissionId) {
            openActionModal('approve', submissionId);
        }
        function rejectKYC(submissionId) {
            openActionModal('reject', submissionId);
        }
        function revokeKYC(submissionId) {
            openActionModal('revoke', submissionId);
        }
        
    </script>
</body>
</html>
